{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Django Template">
    <title>Project Title</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    {% django_htmx_script %}
    <script src="https://unpkg.com/hyperscript.org@0.9.13"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Highlight.js for Code Snippets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.body.addEventListener('htmx:load', function(evt) {
            evt.detail.elt.querySelectorAll('pre code').forEach((block) => {
                if (!block.dataset.highlighted) {
                    hljs.highlightElement(block);
                }
            });
        });
        
        document.body.addEventListener('htmx:wsAfterMessage', function(evt) {
            setTimeout(() => {
                document.querySelectorAll('pre code').forEach((block) => {
                    if (!block.dataset.highlighted) {
                        hljs.highlightElement(block);
                    }
                });
            }, 50);
        });
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        'fade-in-up': {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.3s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        [x-cloak] { 
            display: none !important; 
        }
        h1 {
            @apply text-4xl font-bold mb-4
        }
        h2 {
            @apply text-xl font-bold mb-2
        }
        p {
            @apply mb-4
        }
        .button {
            @apply bg-orange-500 text-white font-bold rounded-lg shadow-md transition-all duration-150 cursor-pointer select-none
        }
        .button, .button a {
            @apply px-6 py-4 inline-block 
        }
        .button:hover {
            @apply bg-orange-600 shadow-lg -translate-y-0.5
        }
        .button:active {
            @apply scale-95 translate-y-0 shadow-sm brightness-90
        }
        .button.alert {
            @apply bg-red-700
        }
        .button.alert:hover {
            @apply bg-red-600
        }
        .button-red {
            @apply !bg-red-500 hover:!bg-red-600
        }
        .button-gray {
            @apply !bg-gray-300 hover:!bg-[#c3c9d0]
        }
        .navitems>li>a {
            @apply flex items-center gap-2 h-12 px-4 hover:bg-[rgba(31,41,55,0.3)] rounded-lg transition-all active:scale-95;
        }
        .hoverlist>* {
            @apply hover:bg-gray-100 rounded-md transition duration-150;
        }
        .hoverlist>*>a {
            @apply flex items-center p-2;
        }
        .highlight {
            @apply !bg-orange-100;
        }
        .allauth content a {
            @apply underline underline-offset-2
        }
        .allauth content a:hover {
            @apply text-orange-500
        }
        .allauth form[action="/accounts/signup/"] ul {
            @apply hidden
        }
        .allauth form[action="/accounts/signup/"] ul.errorlist {
            @apply block
        }
        .allauth .helptext {
            @apply block mt-4
        }
        label {
            @apply hidden
        }
        input[type=file] {
            @apply bg-white pl-0
        }
        .textarea, textarea, input {
            @apply w-full rounded-lg py-4 px-5 bg-white text-gray-900 border border-gray-300 shadow-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors
        }
        .errorlist li {
            @apply p-1 pl-4 border-l-red-500 border-l-4 border-solid mb-2 text-red-500
        }
        label[for="id_remember"] {
            @apply inline-block w-auto mr-2
        }
        input[name="remember"] {
            @apply w-auto
        }
        .alert-info { @apply bg-sky-600 }
        .alert-success { @apply bg-emerald-600 }
        .alert-warning { @apply bg-orange-600 }
        .alert-danger { @apply bg-red-600 }

        .green-dot{
            @apply rounded-full bg-green-500 p-1.5
        }
        .gray-dot{
            @apply rounded-full bg-gray-500 p-1.5
        }
        .graylight-dot{
            @apply rounded-full bg-gray-300 p-1.5
        }
        
        /* Custom Scrollbar for Light Mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            @apply bg-[#fef9f3];
        }
        ::-webkit-scrollbar-thumb {
            @apply bg-orange-200 rounded-full;
        }
        ::-webkit-scrollbar-thumb:hover {
            @apply bg-orange-300;
        }
        /* Markdown Styles inside Messages */
        .shadow-md pre {
            @apply rounded-xl my-2;
            padding: 0 !important;
            background: transparent !important;
        }
        .shadow-md code {
            @apply text-sm;
            background: transparent !important;
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-[#fef9f3] text-gray-900 {% block class %}{% endblock %}">
	
    {% include 'includes/messages.html' %}

    {% include 'includes/header.html' %}

    {% block layout %}
    {% endblock %}

    {% block javascript %}{% endblock %}

    <script>
        // Global form submission loading indicator for login/signup/profile forms
        document.addEventListener('submit', function(e) {
            const form = e.target;
            if (form.id === 'chat_message_form') return; // Handled by WS
            const btn = form.querySelector('button[type="submit"], input[type="submit"]');
            if (btn && !btn.dataset.submitted) {
                btn.dataset.submitted = "true";
                btn.style.pointerEvents = "none";
                btn.style.opacity = "0.85";
                btn.classList.add('animate-pulse');
                const textSpan = btn.querySelector('span') || btn;
                const orig = textSpan.innerText || 'Submit';
                btn.innerHTML = `<span class="inline-flex items-center justify-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>${orig}...</span>
                </span>`;
            }
        });
    </script>
</body>
</html>
