{% load static %}
<header class="flex items-center justify-between bg-white border-b border-gray-200 shadow-sm h-20 px-8 text-gray-800 sticky top-0 z-40">
    <div>
        <a class="flex items-center gap-2" href="/">
            <div class="bg-orange-500 rounded-full p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                </svg>
            </div>
            <span class="text-xl font-extrabold text-orange-500 tracking-tight">ChatSphere</span>
        </a>
    </div>
    <nav class="block relative">
        <ul class="navitems flex items-center justify-center h-full">
            {% if request.user.is_authenticated %}

            <li x-data="{ dropdownOpen: false }" class="relative">
                <a @click="dropdownOpen = !dropdownOpen" @click.away="dropdownOpen = false" class="cursor-pointer select-none flex items-center gap-2">
                    <img class="h-8 w-8 rounded-full object-cover ring-2 ring-orange-200" src="{{ request.user.profile.avatar }}" alt="Avatar" />
                    <span class="font-semibold">{{ request.user.profile.name }}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" x-bind:class="dropdownOpen && 'rotate-180'" class="h-4 w-4 text-gray-500 transition-transform duration-300" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </a>
                <div x-show="dropdownOpen" x-cloak class="absolute right-0 bg-white border border-gray-200 text-gray-800 shadow-xl rounded-lg w-40 p-2 z-20 mt-2"
                x-transition:enter="duration-300 ease-out"
                x-transition:enter-start="opacity-0 -translate-y-5 scale-90"
                x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                >
                    <ul class="hoverlist [&>li>a]:justify-end [&>li>a:hover]:bg-orange-500 [&>li>a:hover]:text-white">
                        <li><a href="{% url 'profile' %}" class="block px-4 py-2 rounded-md transition-colors">My Profile</a></li>
                        <li><a href="{% url 'profile-edit' %}" class="block px-4 py-2 rounded-md transition-colors">Edit Profile</a></li>
                        <li><a href="{% url 'profile-settings' %}" class="block px-4 py-2 rounded-md transition-colors">Settings</a></li>
                        <li><a href="{% url 'account_logout' %}" class="block px-4 py-2 rounded-md transition-colors">Log Out</a></li>
                    </ul>
                </div>
            </li>
            
            {% else %}
            <li><a href="{% url 'account_login' %}">Login</a></li>
            <li><a href="{% url 'account_signup' %}?next={% url 'profile-onboarding' %}">Signup</a></li>
            {% endif %}
        </ul>
    </nav>
</header>
