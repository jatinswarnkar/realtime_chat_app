<li id="msg-{{ message.id }}" class="flex justify-end mb-4 animate-fade-in-up">
    <div class="bg-orange-500/10 border-2 border-orange-500 rounded-2xl p-3 max-w-[75%] shadow-md w-full relative">
        <form hx-post="{% url 'message-edit' message.id %}" class="flex gap-2 w-full">
            {% csrf_token %}
            <textarea name="body" class="w-full bg-white text-gray-900 border border-orange-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 resize-none h-20 text-sm font-mono">{{ raw_body }}</textarea>
            <div class="flex flex-col gap-2 justify-center">
                <button type="submit" class="bg-orange-500 text-white p-2 rounded-lg hover:bg-orange-600 transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
                <button hx-get="{% url 'chatroom' message.group.group_name %}" onClick="window.location.reload()" type="button" class="bg-gray-200 text-gray-700 p-2 rounded-lg hover:bg-gray-300 transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </form>
    </div>
</li>
